<head>
  <title>Hilbert IPv4 Address Map</title>

  <style> body { margin: 0; } </style>

  <script src='//cdn.jsdelivr.net/npm/hilbert-chart-3d'></script>
<!--  <script src='../../dist/hilbert-chart-3d.js'></script>-->
</head>
<body>
  <div id='ipv4-chart'></div>

  <script type="module">
    import * as Ip from 'https://esm.sh/ip.js';
    import { csvParse } from 'https://esm.sh/d3-dsv';
    import { scaleOrdinal } from 'https://esm.sh/d3-scale';
    import { schemePaired } from 'https://esm.sh/d3-scale-chromatic';
    import { color } from 'https://esm.sh/d3-color';

    const opaqueColorScale = scaleOrdinal(schemePaired);
    const transparentColorScale = scaleOrdinal(schemePaired.map(c => {
      const res = color(c);
      res.opacity = 0.25;
      return res.toString();
    }));
    const colorScale = (k, transparent = false) => {
      !transparent ? transparentColorScale(k) : opaqueColorScale(k); // register the color
      return transparent ? transparentColorScale(k) : opaqueColorScale(k);
    }

    // Get the IPv4 data
    fetch('./ipv4-address-space.csv').then(r => r.text()).then(csvParse).then(data => {
      data.forEach(row => {
        row.prefix = row.Prefix;
        row.name = row.Designation;
      });

      const chart = new HilbertChart3D(document.getElementById('ipv4-chart'))
        .hilbertOrder(Math.ceil(32 / 3))
        .data(parseIpData(data))
        .padding(0.15)
        .valFormatter(ipFormatter)
        .color(d => colorScale(d.name))
        .tooltipContent(d => `<b>${d.name}</b>: ${prefixFormatter(d)}`)
        .onClick(d => chart.focusOn(d.start, d.length, 3000))
        .onHover(d1 => chart.color(d2 => colorScale(d2 , d1 && (d1 !== d2))))
        .cameraPosition({ x: -350, y: 160, z: -175 }, { x: -50 });
    });

    //

    function parseIpData(ipData) {
      const prefixes = [];

      ipData.map(row => {
        const pref = new Ip.Prefix(row.prefix);
        return {
          start: pref.firstIp().toNum(),
          length: pref.countIps(),
          name: getName(row.name),
          infos: [row]
        };
      }).forEach(prefix => {
        let last;

        if (prefixes.length
          && (last = prefixes[prefixes.length - 1])
          && last.name === prefix.name
          && (last.start + last.length === prefix.start)) {

          last.length += prefix.length;
          last.infos.push(prefix.infos[0]);
        } else {
          prefixes.push(prefix);
        }
      });

      return prefixes;

      //

      function getName(designation) {
        let name = designation;

        if (name.indexOf('Administered by') > -1) {
          name = 'Various Registries';
        }

        return name;
      }
    }

    function ipFormatter(d) {
      return new Ip.Addr(d).toString();
    }

    function prefixFormatter(d) {
      const ipRange = new Ip.Range(d.start, d.start + d.length - 1),
        prefixes = ipRange.toPrefixes();

      return (prefixes.length === 1 ? prefixes[0] : ipRange).toString();
    }
  </script>
</body>
